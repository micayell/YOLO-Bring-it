server:
  port: 8888
spring:
  application:
    name: config-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/micayell/YOLO-Bring-it.git
          default-label: master
          search-paths: backend-msa/config-repo

management:
  endpoints:
    web:
      exposure:
        include: health, busrefresh